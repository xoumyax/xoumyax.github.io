<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 258" width="550" height="258" class="dg" role="img" aria-label="Hawkeye cache replacement: OPTgen replays Belady's optimal policy on past accesses to train a PC-based predictor, which inserts cache-friendly loads with high priority and cache-averse loads with low priority. Extensions add PC tracking and multi-policy benchmarking."><defs><marker id="dg-hawkeye-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0 L10 5 L0 10 Z"/></marker></defs><g class="dg-edges"><path class="dg-edge" d="M162 37 L192 37" pathLength="1" marker-end="url(#dg-hawkeye-head)"/><path class="dg-edge" d="M348 37 L378 37" pathLength="1" marker-end="url(#dg-hawkeye-head)"/><path class="dg-edge" d="M481 66 L481 100" pathLength="1" marker-end="url(#dg-hawkeye-head)"/><path class="dg-edge" d="M378 129 L270 129 L270 192" pathLength="1" marker-end="url(#dg-hawkeye-head)"/><path class="dg-edge" d="M456 158 L456 192" pathLength="1" marker-end="url(#dg-hawkeye-head)"/><path class="dg-edge dg-edge-dashed" d="M421 66 L421 83 L84 83 L84 100" marker-end="url(#dg-hawkeye-head)"/></g><g class="dg-nodes"><g class="dg-n dg-data"><path class="dg-shape" d="M6 13 a78 5 0 0 1 156 0 V61 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M6 13 a78 5 0 0 0 156 0"/><text x="84" y="36" class="dg-t">Memory access</text><text x="84" y="51" class="dg-s">stream · zsim</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="8" width="156" height="58" rx="10"/><text x="270" y="26.5" class="dg-t">OPTgen</text><text x="270" y="41.5" class="dg-s">Belady's optimal on</text><text x="270" y="56.5" class="dg-s">past accesses</text></g><g class="dg-n dg-proc dg-accent"><rect class="dg-shape" x="378" y="8" width="156" height="58" rx="10"/><text x="456" y="34" class="dg-t">PC-based</text><text x="456" y="49" class="dg-s">predictor</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="