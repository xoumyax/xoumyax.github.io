" y="8" width="156" height="58" rx="10"/><text x="456" y="34" class="dg-t">YaraAST</text><text x="456" y="49" class="dg-s">hybrid tokenizer</text></g><g class="dg-n dg-proc dg-accent"><rect class="dg-shape" x="378" y="100" width="156" height="58" rx="10"/><text x="456" y="126" class="dg-t">BART generator</text><text x="456" y="141" class="dg-s">139M params</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="100" width="156" height="58" rx="10"/><text x="270" y="133.5" class="dg-t">Restore IOCs</text></g><g class="dg-n dg-data"><path class="dg-shape" d="M6 105 a78 5 0 0 1 156 0 V153 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M6 105 a78 5 0 0 0 156 0"/><text x="84" y="135.5" class="dg-t">YARA rule</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="6" y="192" width="156" height="58" rx="10"/><text x="84" y="210.5" class="dg-t">Brownie &amp; Puff</text><text x="84" y="225.5" class="dg-s">BLEU + compile</text><text x="84" y="240.5" class="dg-s">+ Z3 SMT</text></g><g class="dg-n dg-data"><path class="dg-shape" d="M378 197 a78 5 0 0 1 156 0 V245 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M378 197 a78 5 0 0 0 156 0"/><text x="456" y="212.5" class="dg-t">305K crawled rules</text><text x="456" y="227.5" class="dg-s">15M synthetic</text><text x="456" y="242.5" class="dg-s">15M grammar-fuzzed</text></g></g><g class="dg-labels"><g class="dg-label"><rect x="210" y="166" width="144" height="18" rx="9"/><text x="282" y="179">training-time signal</text></g></g></svg>
