<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 258" width="550" height="258" class="dg" role="img" aria-label="Legends of Lantern Town architecture: keyboard and touch input is buffered into a fixed 60 Hz step that drives the campaign simulation of heroes, companion AI and bosses. The simulation emits events that the Canvas renderer draws, that the HUD and audio respond to, and that trigger saves. The published build is encrypted with the passcode."><defs><marker id="dg-lantern-town-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0 L10 5 L0 10 Z"/></marker></defs><g class="dg-edges"><path class="dg-edge" d="M162 37 L192 37" pathLength="1" marker-end="url(#dg-lantern-town-head)"/><path class="dg-edge" d="M348 37 L378 37" pathLength="1" marker-end="url(#dg-lantern-town-head)"/><path class="dg-edge" d="M456 66 L456 100" pathLength="1" marker-end="url(#dg-lantern-town-head)"/><path class="dg-edge" d="M378 129 L348 129" pathLength="1" marker-end="url(#dg-lantern-town-head)"/><path class="dg-edge" d="M192 129 L162 129" pathLength="1" marker-end="url(#dg-lantern-town-head)"/><path class="dg-edge" d="M456 158 L456 192" pathLength="1" marker-end="url(#dg-lantern-town-head)"/></g><g class="dg-nodes"><g class="dg-n dg-proc"><rect class="dg-shape" x="6" y="8" width="156" height="58" rx="10"/><text x="84" y="34" class="dg-t">Keyboard · touch</text><text x="84" y="49" class="dg-s">remappable</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="8" width="156" height="58" rx="10"/><text x="270" y="34" class="dg-t">Fixed 60 Hz step</text><text x="270" y="49" class="dg-s">buffered inputs</text></g><g class="dg-n dg-proc dg-accent"><rect class="dg-shape" x="378" y="8" width="156" height="58" rx="10"/><text x="456" y="34" class="dg-t">Campaign simulation</text><text x="456" y="49" class="dg-s">heroes · AI · bosses</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="378" y="100" width="156" height="58" rx="10"/><text x="456" y="126" class="dg-t">Event stream</text><text x="456" y="141" class="dg-s">hits, deaths, XP</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="100" width="156" height="58" rx="10"/><text x="270" y="126" class="dg-t">Canvas renderer</text><text x="270" y="141" class="dg-s">oil-painted sprites</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="6" y="100" width="156" height="58" rx="10"/><text x="84" y="126" class="dg-t">HUD · audio</text><text x="84" y="141" class="dg-s">dialogue</text></g><g class="dg-n dg-data"><path class="dg-shape" d="M378 197 a78 5 0 0 1 156 0 V245 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M378 197 a78 5 0 0 0 156 0"/><text x="456" y="220" class="dg-t">Save v3</text><text x="456" y="235" class="dg-s">reward ledger</text></g><g class="dg-n dg-data dg-dashed"><path class="dg-shape" d="M6 197 a78 5 0 0 1 156 0 V245 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M6 197 a78 5 0 0 0 156 0"/><text x="84" y="220" class="dg-t">Encrypted build</text><text x="84" y="235" class="dg-s">AES-GCM · passcode</text></g></g><g class="dg-labels"></g></svg>
