<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 258" width="550" height="258" class="dg" role="img" aria-label="Sturdy Fishstick pipeline: 10+ sources land in SQLite, a pre-filter drops listings without an LLM call, a 1.7B local model answers categorical questions, a deterministic score feeds the React dashboard, and a RAG chat retrieves from SQLite FTS5. About 750 listings scored."><defs><marker id="dg-fishstick-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0 L10 5 L0 10 Z"/></marker></defs><g class="dg-edges"><path class="dg-edge" d="M162 37 L192 37" pathLength="1" marker-end="url(#dg-fishstick-head)"/><path class="dg-edge" d="M348 37 L378 37" pathLength="1" marker-end="url(#dg-fishstick-head)"/><path class="dg-edge" d="M270 66 L270 100" pathLength="1" marker-end="url(#dg-fishstick-head)"/><path class="dg-edge" d="M348 129 L378 129" pathLength="1" marker-end="url(#dg-fishstick-head)"/><path class="dg-edge" d="M456 158 L456 192" pathLength="1" marker-end="url(#dg-fishstick-head)"/><path class="dg-edge" d="M378 221 L348 221" pathLength="1" marker-end="url(#dg-fishstick-head)"/></g><g class="dg-nodes"><g class="dg-n dg-data"><path class="dg-shape" d="M6 13 a78 5 0 0 1 156 0 V61 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M6 13 a78 5 0 0 0 156 0"/><text x="84" y="28.5" class="dg-t">10+ sources</text><text x="84" y="43.5" class="dg-s">ATS APIs, LinkedIn,</text><text x="84" y="58.5" class="dg-s">Google Jobs</text></g><g class="dg-n dg-data"><path class="dg-shape" d="M192 13 a78 5 0 0 1 156 0 V61 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M192 13 a78 5 0 0 0 156 0"/><text x="270" y="43.5" class="dg-t">SQLite</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="378" y="8" width="156" height="58" rx="10"/><text x="456" y="26.5" class="dg-t">RAG chat</text><text x="456" y="41.5" class="dg-s">FTS5 retrieval</text><text x="456" y="56.5" class="dg-s">LFM2.5-1.2B</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="100" width="156" height="58" rx="10"/><text x="270" y="126" class="dg-t">Pre-filter</text><text x="270" y="141" class="dg-s">no LLM call</text></g><g class="dg-n dg-proc dg-accent"><rect class="dg-shape" x="378" y="100" width="156" height="58" rx="10"/><text x="456" y="118.5" class="dg-t">Categorical</text><text x="456" y="133.5" class="dg-s">questions</text><text x="456" y="148.5" class="dg-s">qwen3:1.7b</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="378" y="192" width="156" height="58" rx="10"/><text x="456" y="218" class="dg-t">Deterministic</text><text x="456" y="233" class="dg-s">score</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="192" width="156" height="58" rx="10"/><text x="270" y="218" class="dg-t">Dashboard and</text><text x="270" y="233" class="dg-s">Kanban · React</text></g></g><g class="dg-labels"></g></svg>
