<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 258" width="550" height="258" class="dg" role="img" aria-label="Depixelation benchmark loop: a difficulty grid produces pixelated samples, constrained search proposes candidate strings, each candidate is rendered and re-pixelated, and only an exact match counts as recovered. Calibrated abstention is a planned exit. The grid has 360 cells with 10 seeds each."><defs><marker id="dg-depix-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0 L10 5 L0 10 Z"/></marker></defs><g class="dg-edges"><path class="dg-edge" d="M162 37 L192 37" pathLength="1" marker-end="url(#dg-depix-head)"/><path class="dg-edge" d="M348 37 L378 37" pathLength="1" marker-end="url(#dg-depix-head)"/><path class="dg-edge" d="M481 66 L481 100" pathLength="1" marker-end="url(#dg-depix-head)"/><path class="dg-edge" d="M378 129 L348 129" pathLength="1" marker-end="url(#dg-depix-head)"/><path class="dg-edge" d="M270 158 L270 192" pathLength="1" marker-end="url(#dg-depix-head)"/><path class="dg-edge" d="M270 100 L270 83 L421 83 L421 66" pathLength="1" marker-end="url(#dg-depix-head)"/><path class="dg-edge dg-edge-dashed" d="M534 37 L542 37 L542 221 L534 221" marker-end="url(#dg-depix-head)"/></g><g class="dg-nodes"><g class="dg-n dg-proc"><rect class="dg-shape" x="6" y="8" width="156" height="58" rx="10"/><text x="84" y="26.5" class="dg-t">Difficulty grid</text><text x="84" y="41.5" class="dg-s">block size × font ×</text><text x="84" y="56.5" class="dg-s">corruption × charset</text></g><g class="dg-n dg-data"><path class="dg-shape" d="M192 13 a78 5 0 0 1 156 0 V61 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M192 13 a78 5 0 0 0 156 0"/><text x="270" y="36" class="dg-t">Pixelated</text><text x="270" y="51" class="dg-s">text sample</text></g><g class="dg-n dg-proc dg-accent"><rect class="dg-shape" x="378" y="8" width="156" height="58" rx="10"/><text x="456" y="26.5" class="dg-t">Constrained search</text><text x="456" y="41.5" class="dg-s">over candidate</text><text x="456" y="56.5" class="dg-s">strings</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="378" y="100" width="156" height="58" rx="10"/><text x="456" y="118.5" class="dg-t">Render and</text><text x="456" y="133.5" class="dg-s">re-pixelate</text><text x="456" y="148.5" class="dg-s">candidate</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="100" width="156" height="58" rx="10"/><text x="270" y="133.5" class="dg-t">Exact match?</text></g><g class="dg-n dg-data"><path class="dg-shape" d="M192 197 a78 5 0 0 1 156 0 V245 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M192 197 a78 5 0 0 0 156 0"/><text x="270" y="227.5" class="dg-t">Recovered</text></g><g class="dg-n dg-proc dg-dashed"><rect class="dg-shape" x="378" y="192" width="156" height="58" rx="10"/><text x="456" y="218" class="dg-t">Calibrated</text><text x="456" y="233" class="dg-s">abstention</text></g></g><g class="dg-labels"><g class="dg-label"><rect x="254.1" y="166" width="31.799999999999997" height="18" rx="9"/><text x="270" y="179">yes</text></g><g class="dg-label"><rect x="307.4" y="74" width="25.2" height="18" rx="9"/><text x="320" y="87">no</text></g></g></svg>
