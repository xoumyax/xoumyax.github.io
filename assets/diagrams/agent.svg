<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 258" width="550" height="258" class="dg" role="img" aria-label="Research agent loop: the agent thinks, tags the query as clear or ambiguous, asks one minimal clarifying question when it is ambiguous, then calls tools over MCP and answers with citations. Pause-detection F1 rose from 0.168 to 0.573."><defs><marker id="dg-agent-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0 L10 5 L0 10 Z"/></marker></defs><g class="dg-edges"><path class="dg-edge" d="M162 37 L192 37" pathLength="1" marker-end="url(#dg-agent-head)"/><path class="dg-edge" d="M348 37 L378 37" pathLength="1" marker-end="url(#dg-agent-head)"/><path class="dg-edge" d="M456 66 L456 100" pathLength="1" marker-end="url(#dg-agent-head)"/><path class="dg-edge" d="M378 129 L348 129" pathLength="1" marker-end="url(#dg-agent-head)"/><path class="dg-edge" d="M270 158 L270 192" pathLength="1" marker-end="url(#dg-agent-head)"/><path class="dg-edge" d="M534 37 L542 37 L542 221 L348 221" pathLength="1" marker-end="url(#dg-agent-head)"/><path class="dg-edge" d="M192 221 L162 221" pathLength="1" marker-end="url(#dg-agent-head)"/></g><g class="dg-nodes"><g class="dg-n dg-data"><path class="dg-shape" d="M6 13 a78 5 0 0 1 156 0 V61 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M6 13 a78 5 0 0 0 156 0"/><text x="84" y="43.5" class="dg-t">User query</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="8" width="156" height="58" rx="10"/><text x="270" y="41.5" class="dg-t">think</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="378" y="8" width="156" height="58" rx="10"/><text x="456" y="34" class="dg-t">Ambiguity tag</text><text x="456" y="49" class="dg-s">clear or ambiguous?</text></g><g class="dg-n dg-proc dg-accent"><rect class="dg-shape" x="378" y="100" width="156" height="58" rx="10"/><text x="456" y="126" class="dg-t">Ask one minimal</text><text x="456" y="141" class="dg-s">clarifying question</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="100" width="156" height="58" rx="10"/><text x="270" y="133.5" class="dg-t">User answers</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="192" width="156" height="58" rx="10"/><text x="270" y="210.5" class="dg-t">Tools over MCP</text><text x="270" y="225.5" class="dg-s">web search,</text><text x="270" y="240.5" class="dg-s">Semantic Scholar</text></g><g class="dg-n dg-data"><path class="dg-shape" d="M6 197 a78 5 0 0 1 156 0 V245 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M6 197 a78 5 0 0 0 156 0"/><text x="84" y="220" class="dg-t">Answer with</text><text x="84" y="235" class="dg-s">citations</text></g></g><g class="dg-labels"><g class="dg-label"><rect x="420.3" y="74" width="71.4" height="18" rx="9"/><text x="456" y="87">ambiguous</text></g><g class="dg-label"><rect x="453.5" y="212" width="45" height="18" rx="9"/><text x="476" y="225">clear</text></g></g></svg>
