<rect class="dg-shape" x="378" y="100" width="156" height="58" rx="10"/><text x="456" y="118.5" class="dg-t">XGBoost +</text><text x="456" y="133.5" class="dg-s">random forest</text><text x="456" y="148.5" class="dg-s">malware verdict</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="100" width="156" height="58" rx="10"/><text x="270" y="126" class="dg-t">Family lookup</text><text x="270" y="141" class="dg-s">hash similarity</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="6" y="100" width="156" height="58" rx="10"/><text x="84" y="126" class="dg-t">LLM explanation</text><text x="84" y="141" class="dg-s">of the verdict</text></g><g class="dg-n dg-data"><path class="dg-shape" d="M6 197 a78 5 0 0 1 156 0 V245 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M6 197 a78 5 0 0 0 156 0"/><text x="84" y="220" class="dg-t">Dashboard</text><text x="84" y="235" class="dg-s">results + live alerts</text></g></g><g class="dg-labels"></g></svg>
