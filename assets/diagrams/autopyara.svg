<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 258" width="550" height="258" class="dg" role="img" aria-label="AutoPYara pipeline: about 71K Windows PE samples are clustered by family, a subcluster estimate and a centroid selection both feed the biclustering rule generator, and the resulting YARA rules ship as a pip package. It beats AutoYara by 14 pp rule coverage."><defs><marker id="dg-autopyara-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0 L10 5 L0 10 Z"/></marker></defs><g class="dg-edges"><path class="dg-edge" d="M162 37 L192 37" pathLength="1" marker-end="url(#dg-autopyara-head)"/><path class="dg-edge" d="M348 37 L378 37" pathLength="1" marker-end="url(#dg-autopyara-head)"/><path class="dg-edge" d="M270 66 L270 100" pathLength="1" marker-end="url(#dg-autopyara-head)"/><path class="dg-edge" d="M456 66 L456 100" pathLength="1" marker-end="url(#dg-autopyara-head)"/><path class="dg-edge" d="M348 129 L378 129" pathLength="1" marker-end="url(#dg-autopyara-head)"/><path class="dg-edge" d="M456 158 L456 192" pathLength="1" marker-end="url(#dg-autopyara-head)"/><path class="dg-edge" d="M378 221 L348 221" pathLength="1" marker-end="url(#dg-autopyara-head)"/></g><g class="dg-nodes"><g class="dg-n dg-data"><path class="dg-shape" d="M6 13 a78 5 0 0 1 156 0 V61 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M6 13 a78 5 0 0 0 156 0"/><text x="84" y="36" class="dg-t">≈71K Windows PE</text><text x="84" y="51" class="dg-s">samples · 8 years</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="8" width="156" height="58" rx="10"/><text x="270" y="34" class="dg-t">Family clustering</text><text x="270" y="49" class="dg-s">optimal-K heuristics</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="378" y="8" width="156" height="58" rx="10"/><text x="456" y="26.5" class="dg-t">Subcluster estimate</text><text x="456" y="41.5" class="dg-s">historical</text><text x="456" y="56.5" class="dg-s">VirusTotal data</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="100" width="156" height="58" rx="10"/><text x="270" y="126" class="dg-t">Centroid selection</text><text x="270" y="141" class="dg-s">similarity hashing</text></g><g class="dg-n dg-proc dg-accent"><rect class="dg-shape" x="378" y="100" width="156" height="58" rx="10"/><text x="456" y="126" class="dg-t">Biclustering</text><text x="456" y="141" class="dg-s">rule generator</text></g><g class="dg-n dg-data"><path class="dg-shape" d="M378 197 a78 5 0 0 1 156 0 V245 a78 5 0 0 1 -156 0 Z"/><path class="dg-rim" d="M378 197 a78 5 0 0 0 156 0"/><text x="456" y="227.5" class="dg-t">YARA rules</text></g><g class="dg-n dg-proc"><rect class="dg-shape" x="192" y="192" width="156" height="58" rx="10"/><text x="270" y="218" class="dg-t">pip install</text><text x="270" y="233" class="dg-s">autopyara · PyPI</text></g></g><g class="dg-labels"></g></svg>
