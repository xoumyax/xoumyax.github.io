<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSCE 313 — Lab Materials</title>
  <meta name="description" content="Lab materials for CSCE 313: Introduction to Computer Systems, Texas A&M University." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: oklch(0.972 0.012 225);
      --surface: #ffffff;
      --ink: oklch(0.3 0.035 240);
      --muted: oklch(0.5 0.03 240);
      --accent: oklch(0.62 0.16 30);
      --border: oklch(0.9 0.015 230);
      --font-display: "Baloo 2", "Nunito Sans", sans-serif;
      --font-body: "Nunito Sans", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: oklch(0.21 0.03 255);
        --surface: oklch(0.27 0.032 250);
        --ink: oklch(0.93 0.015 235);
        --muted: oklch(0.72 0.02 240);
        --accent: oklch(0.72 0.14 35);
        --border: oklch(0.35 0.03 250);
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.6;
      padding: 2.5rem 1.25rem 4rem;
    }
    main { max-width: 640px; margin: 0 auto; }
    .crumb {
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
    }
    .crumb:hover { color: var(--accent); }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      line-height: 1.12;
      margin-top: 0.75rem;
    }
    .sub { color: var(--muted); margin-top: 0.35rem; }
    section { margin-top: 2.25rem; }
    h2 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
    }
    ul { list-style: none; padding: 0; display: grid; gap: 0.6rem; }
    li a {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }
    li a:hover { border-color: var(--accent); color: var(--accent); }
    li a .tag {
      margin-left: auto;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
      flex-shrink: 0;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <a class="crumb" href="/">← soumyajyoti dutta</a>
    <h1>CSCE 313 · Lab Materials</h1>
    <p class="sub">Introduction to Computer Systems — Texas A&amp;M University · Fall 2026</p>

    <section>
      <h2>Lab 1 — Getting Started</h2>
      <ul>
        <li><a href="Lab1/lab1.pdf">Lab 1 Handout <span class="tag">PDF</span></a></li>
        <li><a href="Lab1/Computer%20systems%20intro%20setup.pdf">Intro &amp; Environment Setup <span class="tag">PDF</span></a></li>
        <li><a href="Lab1/CSCE313_Linux_Cheatsheet.pdf">Linux Cheatsheet <span class="tag">PDF</span></a></li>
      </ul>
    </section>

    <footer>
      Questions? Email <a href="mailto:soumyajyotidutta23@gmail.com">soumyajyotidutta23@gmail.com</a> or ask in lab.
    </footer>
  </main>
</body>
</html>
